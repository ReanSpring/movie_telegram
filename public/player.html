<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Movie Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      #player-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      iframe,
      video {
        width: 100%;
        height: 100%;
        border: none;
        display: none;
      }
      .status-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        z-index: 10;
        padding: 20px;
        box-sizing: border-box;
      }
      .loader {
        border: 4px solid #333;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .error-icon {
        font-size: 50px;
        margin-bottom: 10px;
      }
      .error-details {
        font-size: 12px;
        color: #888;
        margin-top: 10px;
        max-width: 80%;
        word-break: break-all;
      }
      .retry-btn {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #3498db;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="player-container">
      <div id="status" class="status-container">
        <div class="loader"></div>
        <div id="status-text">Loading movie...</div>
      </div>

      <iframe
        id="video-iframe"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        allow="autoplay; fullscreen; picture-in-picture"
      ></iframe>

      <video id="video-player" controls playsinline preload="auto"></video>
    </div>

    <script>
      const webapp = window.Telegram.WebApp;
      webapp.ready();
      webapp.expand();

      const urlParams = new URLSearchParams(window.location.search);
      const movieId = urlParams.get("id");
      const directUrl = decodeURIComponent(urlParams.get("url") || "");

      const iframe = document.getElementById("video-iframe");
      const video = document.getElementById("video-player");
      const status = document.getElementById("status");
      const statusText = document.getElementById("status-text");

      function showError(msg, details = "") {
        status.style.display = "flex";
        status.innerHTML = `
          <div class="error-icon">⚠️</div>
          <div>${msg}</div>
          ${details ? `<div class="error-details">${details}</div>` : ""}
          <button class="retry-btn" onclick="location.reload()">Retry</button>
        `;
      }

      function hideStatus() {
        status.style.display = "none";
      }

      function isDirectVideo(url) {
        if (!url) return false;
        // Check for common video extensions
        const videoExtensions = [
          ".mp4",
          ".m4v",
          ".webm",
          ".ogv",
          ".mov",
          ".mkv",
        ];
        const urlWithoutQuery = url.split("?")[0].toLowerCase();
        return videoExtensions.some((ext) => urlWithoutQuery.endsWith(ext));
      }

      try {
        if (directUrl && isDirectVideo(directUrl)) {
          // It's a direct video file, use <video> tag
          video.style.display = "block";
          video.src = directUrl;

          video.oncanplay = () => {
            hideStatus();
            video.play().catch((e) => console.log("Autoplay prevented"));
          };

          video.onerror = () => {
            let errorMsg = "Failed to load video.";
            let technical = "";
            if (video.error) {
              switch (video.error.code) {
                case 1:
                  technical = "MEDIA_ERR_ABORTED";
                  break;
                case 2:
                  technical = "MEDIA_ERR_NETWORK";
                  break;
                case 3:
                  technical = "MEDIA_ERR_DECODE";
                  break;
                case 4:
                  technical = "MEDIA_ERR_SRC_NOT_SUPPORTED";
                  break;
                default:
                  technical = "Unknown error code: " + video.error.code;
              }
            }
            showError(
              "This video source is currently unavailable.",
              `Error: ${technical}<br>Source: ${directUrl}`,
            );
          };
        } else if (directUrl || movieId) {
          // It's an embed URL or we have a movie ID for vidsrc
          let embedUrl = directUrl;
          if (!embedUrl && movieId) {
            embedUrl = `https://vidsrc.xyz/embed/movie/${movieId}`;
          }

          iframe.style.display = "block";
          iframe.src = embedUrl;

          // Iframe load event is not reliable for content success,
          // but we can hide the loader after some time
          iframe.onload = () => {
            setTimeout(hideStatus, 2000);
          };
        } else {
          showError("Movie source not found.");
        }
      } catch (err) {
        showError("An unexpected error occurred.");
      }
    </script>
  </body>
</html>
